version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      # Minor and patch bumps arrive as one pull request; a major gets its own.
      dev-tooling: { patterns: ['*'], update-types: [minor, patch] }
    ignore:
      # Moved by hand: the eve adapter is verified against one eve line at a
      # time (packages/eve/NOTES.md), and `ai` follows what eve peers.
      - dependency-name: eve
      - dependency-name: ai
      # Moved by hand: ci.yml installs the same versions by number
      # (smoke-workerd, smoke-browser), so both places change together.
      - dependency-name: miniflare
      - dependency-name: playwright
