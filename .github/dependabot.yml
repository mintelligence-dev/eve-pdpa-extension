version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      dev-tooling: { patterns: ['*'] }
    ignore:
      # Moved by hand: the eve adapter is verified against one eve line at a
      # time (packages/eve/NOTES.md), and `ai` follows what eve peers.
      - dependency-name: eve
      - dependency-name: ai
