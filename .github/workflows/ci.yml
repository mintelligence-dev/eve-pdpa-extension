# Structure: build ONCE on Node 24, then smoke the resulting artifact on every
# runtime with no install at all. Two reasons:
#   1. the dev toolchain (vitest, size-limit, tsdown) requires Node 22+, so a
#      Node 18 or 20 job literally cannot run `pnpm install`
#   2. testing the published artifact beats testing a fresh rebuild of source
name: ci

on:
  push: { branches: [main] }
  pull_request: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-dist
          # .size is what `pnpm size` measures. upload-artifact skips hidden
          # paths unless told otherwise (v4.4+), and the gates job then finds
          # nothing to measure.
          include-hidden-files: true
          # package.json too: the smoke jobs run this artifact with no checkout,
          # and without its "type": "module" Node 18 reads dist/index.js as
          # CommonJS. Newer Node detects the syntax, which hid this.
          path: |
            packages/core/package.json
            packages/core/dist
            packages/core/.size
            packages/core/smoke
          retention-days: 3
      # Separate artifact: adding cli paths to core-dist would move its root
      # from packages/core to packages/ and break every download above.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-dist
          path: |
            packages/cli/dist
            packages/cli/smoke
          retention-days: 3
      # package.json for "type": "module", as for core. D24.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: http-dist
          path: |
            packages/http/package.json
            packages/http/dist
            packages/http/smoke
          retention-days: 3
      # package.json for "type": "module" and the exports map, as for http.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: middleware-dist
          path: |
            packages/middleware/package.json
            packages/middleware/dist
            packages/middleware/smoke
          retention-days: 3

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck          # includes internal/consumer-* — proves the exports map
      - run: pnpm test --coverage

  constraints:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: core-dist, path: packages/core }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: http-dist, path: packages/http }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: middleware-dist, path: packages/middleware }
      - run: pnpm gate:deps
      - run: pnpm gate:builtins
      - run: pnpm gate:ner
      - run: pnpm gate:attestation
      - run: pnpm gate:pack          # publint --strict + attw --pack
      - run: pnpm size

  smoke-node-core:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # '18' resolves to the newest 18.x, so 18.18.0 — the floor both
        # packages put in engines — is pinned on its own. Odd majors are left
        # out: none is ever LTS and every one is past end of life.
        # Keep in step with smoke-node-cli.
        node: ['18.18.0', '18', '20', '22', '24', '26']
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: core-dist, path: packages/core }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ matrix.node }}' }
      # No install. Runs the shipped artifact directly.
      # On Node 18 the smoke script asserts ERR_PDPA_NO_CSPRNG without a
      # randomSource and success with one — D7 as a tested contract.
      - run: node packages/core/smoke/run.mjs

  # Its own job so a core failure on one Node version does not hide whether
  # the cli works there too.
  smoke-node-cli:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.18.0', '18', '20', '22', '24', '26']
    steps:
      # Checkout only for the package.json files: Node needs core's exports map
      # to resolve the cli's import of @eve-pdpa-extension/core.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: core-dist, path: packages/core }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: cli-dist, path: packages/cli }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ matrix.node }}' }
      # No install. The link pnpm would make, so the cli finds core.
      - run: |
          mkdir -p packages/cli/node_modules/@eve-pdpa-extension
          ln -s ../../../core packages/cli/node_modules/@eve-pdpa-extension/core
      - run: node packages/cli/smoke/run.mjs

  # D24: http claims every Node from 20 (its engines) and web standards only.
  # The shipped dist, no install, core linked beside it as pnpm would.
  smoke-node-http:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: core-dist, path: packages/core }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: http-dist, path: packages/http }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ matrix.node }}' }
      - run: |
          mkdir -p packages/http/node_modules/@eve-pdpa-extension
          ln -s ../../../core packages/http/node_modules/@eve-pdpa-extension/core
      - run: node packages/http/smoke/run.mjs

  # middleware claims what core claims: Node 18.18 and up, ESM and CJS, and
  # the web-standard runtimes below. The shipped dist, no install.
  smoke-node-middleware:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.18.0', '18', '20', '22', '24', '26']
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: core-dist, path: packages/core }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: middleware-dist, path: packages/middleware }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ matrix.node }}' }
      - run: |
          mkdir -p packages/middleware/node_modules/@eve-pdpa-extension
          ln -s ../../../core packages/middleware/node_modules/@eve-pdpa-extension/core
      - run: node packages/middleware/smoke/run.mjs
      # The exports map, both conditions: require() reaches the CJS build.
      - working-directory: packages/middleware
        run: node smoke/pkg.cjs && node smoke/pkg.mjs

  # The MCP server has dependencies (the MCP SDK and zod), so this job installs
  # and builds on Node 24, then runs the built program on each Node its engines
  # allow. 20.0.0 is the floor, pinned on its own as core pins 18.18.0.
  smoke-node-mcp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.0.0', '20', '22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eve-pdpa-extension/mcp... build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ matrix.node }}' }
      - run: node packages/mcp/smoke/run.mjs

  smoke-deno:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: core-dist, path: packages/core }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with: { deno-version: v2.x }
      # No -A, no --allow-*. This is the canonical "no network calls" proof:
      # Deno halts on any filesystem, network, env or subprocess access.
      - run: deno run packages/core/smoke/run.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: middleware-dist, path: packages/middleware }
      - run: |
          mkdir -p packages/middleware/node_modules/@eve-pdpa-extension
          ln -s ../../../core packages/middleware/node_modules/@eve-pdpa-extension/core
      - run: deno run packages/middleware/smoke/run.mjs

  smoke-bun:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: core-dist, path: packages/core }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun packages/core/smoke/run.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: middleware-dist, path: packages/middleware }
      - run: |
          mkdir -p packages/middleware/node_modules/@eve-pdpa-extension
          ln -s ../../../core packages/middleware/node_modules/@eve-pdpa-extension/core
      - run: bun packages/middleware/smoke/run.mjs

  smoke-workerd:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: core-dist, path: packages/core }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: http-dist, path: packages/http }
      - run: npm i --no-save miniflare@4.20260730.0
      - run: node scripts/smoke-workerd.mjs
      - run: node scripts/smoke-workerd.mjs http
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: middleware-dist, path: packages/middleware }
      - run: node scripts/smoke-workerd.mjs middleware

  smoke-browser:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: core-dist, path: packages/core }
      - run: npx --yes playwright@1.63.0 install --with-deps chromium
      - run: npm i --no-save playwright@1.63.0
      - run: node scripts/smoke-browser.mjs

  # The eve adapter. eve needs Node 24, and nothing of
  # it goes near core's smoke matrix: core stays zero-dependency and runs on
  # Node 18 and every runtime above; this package runs on Node 24 only.
  eve:
    runs-on: ubuntu-latest
    env:
      EVE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @eve-pdpa-extension/eve test
      # What npm would get: publint --strict on the packed tarball, and attw
      # on its types. ESM only, as eve is — CJS and node10 are not checked.
      - run: pnpm --filter @eve-pdpa-extension/eve check:pack
