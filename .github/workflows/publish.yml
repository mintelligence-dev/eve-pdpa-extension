# Stages core and cli on npm when a v* tag is pushed. Nothing becomes
# installable until an owner approves each version on npmjs.com → Staged
# Packages, which asks for 2FA: a leaked token or a wrong tag cannot ship a
# release on its own.
#
# Authentication: npm lets a trusted publisher be set only on a package that
# already exists, so the first release signs in with NPM_TOKEN — a granular
# token for @eve-pdpa-extension without 2FA bypass. Once both packages exist,
# add this workflow as their trusted publisher and delete the secret: npm then
# signs in with this job's OIDC token and nothing else here changes.
#
# Run it by hand (Actions → publish → Run workflow) to rehearse: it builds,
# tests, packs and runs `npm stage publish --dry-run`, sending nothing.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # OIDC, for trusted publishing

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # the whole history, to check the tag is on main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version: '24', cache: pnpm, registry-url: 'https://registry.npmjs.org' }
      # `npm stage` needs npm 11.15 or later; Node 24 may come with an older 11.
      - run: npm install -g npm@11.21.0
      - name: Versions and tag agree
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          cli=$(node -p "require('./packages/cli/package.json').version")
          [ "$cli" = "$version" ] || { echo "core is $version but cli is $cli"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag is $GITHUB_REF_NAME but the packages are $version"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main"; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm gate:tarballs
      # pnpm, not npm, packs: it runs prepack and turns workspace:^ into ^0.1.0.
      - name: Pack
        run: |
          mkdir out
          for p in core cli; do (cd "packages/$p" && pnpm pack --pack-destination ../../out); done
          ls -l out
      - name: Stage on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          case "$VERSION" in *-*) tag=next ;; *) tag=latest ;; esac
          dry=""
          [ "$GITHUB_EVENT_NAME" = push ] || dry="--dry-run"
          # core first: cli depends on it.
          for p in core cli; do
            npm stage publish "./out/eve-pdpa-extension-$p-$VERSION.tgz" --tag "$tag" --access public $dry
          done
