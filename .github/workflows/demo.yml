# Builds the live demo (apps/demo, Next.js + Mintel UI) on pull requests that touch it, so a
# broken page is caught before merge. The page is hosted on Vercel (project
# eve-pdpa-extension in the mintelligence team, configured by vercel.json);
# nothing is deployed from here.
name: demo

on:
  pull_request:
    paths:
      - 'apps/demo/**'
      - 'packages/core/**'
      - 'examples/pdpa-policy.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vercel.json'
      - '.github/workflows/demo.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

# Job names are unique on purpose: `build` is a required check from ci.yml.
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eve-pdpa-extension/core build
      # The same build Vercel runs (vercel.json): a static export in apps/demo/out.
      - run: pnpm --filter @eve-pdpa-extension/demo build
        env: { NEXT_TELEMETRY_DISABLED: '1' }
