# Builds the live demo (scripts/demo) and publishes it on GitHub Pages.
# Pull requests that touch the demo or core build it too, so a broken page is
# caught before merge; only main deploys.
name: demo

on:
  push:
    branches: [main]
    paths:
      - 'scripts/demo/**'
      - 'packages/core/**'
      - 'examples/pdpa-policy.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/demo.yml'
  pull_request:
    paths:
      - 'scripts/demo/**'
      - 'packages/core/**'
      - 'examples/pdpa-policy.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/demo.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The demo inlines core's dist bundle; nothing else needs building.
      - run: pnpm --filter @eve-pdpa-extension/core build
      - run: node scripts/demo/build.mjs
      - name: Assemble the site
        run: |
          mkdir _site
          cp scripts/demo/out/pdpa-demo.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: _site }

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
